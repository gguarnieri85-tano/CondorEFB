<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CondorEFB v2.2 (HiDPI Vector & Page-State Ready)</title>
    <!-- PDF.js CDN for client-side PDF rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-dark: #0e1117;
            --panel-bg: #161b22;
            --panel-secondary: #1f242d;
            --border-color: #30363d;
            --accent-blue: #00a8ff;
            --accent-green: #2ecc71;
            --accent-warn: #f39c12;
            --accent-danger: #e74c3c;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --header-bg: #161b22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background-color: var(--header-bg);
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .brand {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand .version-badge {
            color: var(--accent-blue);
            font-size: 10px;
            background: rgba(0, 168, 255, 0.12);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0, 168, 255, 0.4);
            font-weight: 600;
        }

        /* Sim Time Clock Display */
        .sim-clock-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 168, 255, 0.1);
            border: 1px solid var(--accent-blue);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .sim-clock-time {
            font-family: "Courier New", Courier, monospace;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            letter-spacing: 1px;
        }

        .view-switchers {
            display: flex;
            gap: 4px;
            background: var(--bg-dark);
            padding: 3px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
        }

        .top-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Storage Meter Component */
        .storage-meter-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 110px;
            font-size: 9px;
            color: var(--text-dim);
        }

        .storage-label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .storage-bar-bg {
            height: 5px;
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .storage-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-blue);
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .btn-action {
            background-color: var(--accent-blue);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            border: none;
        }

        .btn-action:hover { opacity: 0.9; }

        .btn-secondary {
            background-color: var(--panel-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-secondary:hover { border-color: var(--accent-blue); color: #fff; }

        input[type="file"] { display: none; }

        /* Main Layout */
        .efb-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 48px);
            position: relative;
        }

        /* Sidebar Container (Collapsible) */
        .sidebar-container {
            display: flex;
            width: 520px;
            border-right: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            transition: margin-left 0.25s ease;
        }

        .sidebar-container.collapsed { margin-left: -520px; }

        /* Column 1: Folders */
        .folders-column {
            width: 240px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .column-header {
            padding: 8px 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
        }

        .search-box {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }

        .search-box input:focus { border-color: var(--accent-blue); }

        .category-section-header {
            padding: 8px 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-blue);
            background: rgba(0, 168, 255, 0.08);
            border-bottom: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
        }

        .folders-scroll-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .folder-card {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .folder-card:hover { background: var(--panel-secondary); }

        .folder-card.active {
            background: var(--panel-secondary);
            border-left: 4px solid var(--accent-blue);
        }

        .folder-card .folder-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
        }

        .folder-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 6px;
            border-radius: 3px;
        }

        .icon-btn:hover {
            color: var(--accent-blue);
            background: rgba(255,255,255,0.1);
        }

        /* Column 2: PDF Charts List */
        .plates-column {
            width: 280px;
            background-color: var(--panel-secondary);
            display: flex;
            flex-direction: column;
        }

        .plates-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .plate-card {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .plate-card:hover { background: rgba(255, 255, 255, 0.04); }

        .plate-card.active {
            background: rgba(0, 168, 255, 0.15);
            color: #fff;
            border-right: 3px solid var(--accent-blue);
        }

        .plate-card .plate-title-text {
            font-weight: 600;
            word-break: break-word;
        }

        .plate-card .plate-meta-text {
            font-size: 10px;
            color: var(--text-dim);
        }

        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            background: var(--border-color);
            color: var(--text-dim);
            font-weight: normal;
        }

        .badge.active { background: var(--accent-blue); color: #fff; }

        /* Viewer Section */
        main {
            flex: 1;
            background-color: #050607;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .viewer-toolbar {
            height: 44px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        .plate-title {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .page-controls, .zoom-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .page-input {
            width: 42px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: #fff;
            text-align: center;
            font-size: 12px;
            padding: 4px 2px;
            border-radius: 4px;
        }

        .btn-tool {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            min-width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            padding: 0 8px;
        }

        .btn-tool:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        .canvas-container {
            flex: 1;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
        }

        canvas {
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            border-radius: 4px;
            display: block;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--text-dim);
        }

        .empty-state h3 { color: var(--text-main); margin-bottom: 6px; }

        /* Web Map Iframe Frame */
        #webMapFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        /* Night Mode */
        .night-mode canvas {
            filter: invert(0.9) hue-rotate(180deg) contrast(1.2);
        }

        /* Data Pack Action Tray */
        .datapack-tray {
            padding: 8px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 6px;
        }

        .datapack-tray button { flex: 1; font-size: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            CondorEFB <span class="version-badge">v2.2</span>
        </div>

        <!-- Sim Time Running Clock Display -->
        <div class="sim-clock-container" id="setSimTimeBtn" title="Click to set Sim Time offset">
            <span style="font-size:11px;">⏱️ SIM</span>
            <span class="sim-clock-time" id="simClockDisplay">00:00:00</span>
        </div>

        <!-- View Switcher Tabs -->
        <div class="view-switchers">
            <button class="tab-btn active" id="tabChartsView">📄 Charts</button>
            <button class="tab-btn" id="tabMapView">🗺️ KTO Map</button>
        </div>

        <div class="top-controls">
            <!-- Storage Meter Widget -->
            <div class="storage-meter-container" title="IndexedDB Usage">
                <div class="storage-label">
                    <span>STORAGE</span>
                    <span id="storageText">0.0 MB</span>
                </div>
                <div class="storage-bar-bg">
                    <div class="storage-bar-fill" id="storageBarFill"></div>
                </div>
            </div>

            <button class="btn-tool" id="toggleSidebarBtn" title="Toggle Navigation Menu">◄ Hide</button>
            <button class="btn-tool" id="nightToggle" title="Toggle Night Vision Mode">🌙</button>
        </div>
    </header>

    <div class="efb-container">
        <!-- Collapsible Navigation Sidebar -->
        <div class="sidebar-container" id="sidebarContainer">
            <!-- Left Panel: Custom User Folders -->
            <div class="folders-column">
                <div class="column-header">
                    <span>Folders</span>
                    <button class="btn-action" id="createUserFolderBtn">+ Folder</button>
                </div>
                <div class="search-box">
                    <input type="text" id="folderSearchInput" placeholder="Filter folders...">
                </div>
                <div class="folders-scroll-list" id="foldersScrollList">
                    <!-- Populated dynamically -->
                </div>
                
                <!-- Data Pack Backup Controls -->
                <div class="datapack-tray">
                    <button class="btn-secondary" id="exportDataPackBtn" title="Download EFB Data Pack Backup">📥 Export Pack</button>
                    <button class="btn-secondary" id="importDataPackBtn" title="Restore Data Pack Backup">📤 Import Pack</button>
                </div>
            </div>

            <!-- Middle Panel: PDF Approach Charts inside Selected Folder -->
            <div class="plates-column">
                <div class="column-header">
                    <span id="platesHeaderTitle">Select Folder</span>
                    <button class="btn-action" id="uploadPdfBtn" style="display:none;">+ PDF</button>
                </div>
                <div class="plates-list" id="platesList">
                    <div style="padding: 16px; font-size: 12px; color: var(--text-dim); text-align: center;">
                        Select a folder on the left to view charts.
                    </div>
                </div>
            </div>
        </div>

        <!-- Main PDF Chart Viewer -->
        <main>
            <div class="viewer-toolbar" id="toolbar" style="display: none;">
                <div class="plate-title" id="plateTitle">No Chart Selected</div>

                <!-- Page Navigation Controls -->
                <div class="page-controls">
                    <button class="btn-tool" id="prevPageBtn">◄</button>
                    <input type="number" id="pageNumberInput" class="page-input" value="1" min="1">
                    <span id="totalPagesText" style="font-size: 11px; color: var(--text-dim);">/ 1</span>
                    <button class="btn-tool" id="nextPageBtn">►</button>
                </div>

                <!-- Zoom Controls -->
                <div class="zoom-controls">
                    <button class="btn-tool" id="zoomOut">-</button>
                    <span id="zoomLevel" style="font-size: 11px; width: 36px; text-align: center;">100%</span>
                    <button class="btn-tool" id="zoomIn">+</button>
                    <button class="btn-tool" id="deletePlate" title="Delete Chart" style="color: #ff5555; margin-left: 6px;">✕</button>
                </div>
            </div>

            <div class="canvas-container" id="canvasContainer">
                <div class="empty-state" id="emptyState">
                    <h3>No Chart Selected</h3>
                    <p>Select a folder on the left, then click an approach chart or document to open.</p>
                </div>
                <canvas id="pdfCanvas" style="display: none;"></canvas>
            </div>

            <!-- Embedded Interactive Web Map -->
            <iframe id="webMapFrame" src="https://maps.falcon-bms.com/01_KTO_Interactive_Map/index.html"></iframe>
        </main>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="fileInput" accept="application/pdf" multiple>
    <input type="file" id="dataPackFileInput" accept=".condorefb,.json,application/json,text/plain,*/*">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            // --- IndexedDB Storage Engine (v3 Upgrade for Persistent Page Memory) ---
            const DB_NAME = 'CondorEFB_DB';
            const DB_VERSION = 3;
            let db = null;

            function initDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains('folders')) {
                            database.createObjectStore('folders', { keyPath: 'id' });
                        }
                        if (!database.objectStoreNames.contains('plates')) {
                            const plateStore = database.createObjectStore('plates', { keyPath: 'id' });
                            plateStore.createIndex('folderId', 'folderId', { unique: false });
                        }
                    };
                    request.onsuccess = (e) => {
                        db = e.target.result;
                        resolve(db);
                    };
                    request.onerror = (e) => reject(e);
                });
            }

            function dbGetAll(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e);
                });
            }

            function dbPut(storeName, item) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.put(item);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e);
                });
            }

            function dbDelete(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve();
                    request.onerror = (e) => reject(e);
                });
            }

            // State Variables
            let database = [];
            let userFolders = [];
            let selectedFolder = null;
            let activePlateRecord = null;
            let currentPdf = null;
            let currentPageNum = 1;
            let totalPages = 1;
            let currentScale = 1.0;
            let currentRenderTask = null;

            // Sim Clock State
            let simTimeOffsetMs = 0;

            // Elements
            const sidebarContainer = document.getElementById('sidebarContainer');
            const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
            const foldersScrollList = document.getElementById('foldersScrollList');
            const folderSearchInput = document.getElementById('folderSearchInput');
            const createUserFolderBtn = document.getElementById('createUserFolderBtn');
            
            const platesList = document.getElementById('platesList');
            const platesHeaderTitle = document.getElementById('platesHeaderTitle');
            const uploadPdfBtn = document.getElementById('uploadPdfBtn');
            const fileInput = document.getElementById('fileInput');

            const canvas = document.getElementById('pdfCanvas');
            const ctx = canvas.getContext('2d');
            const toolbar = document.getElementById('toolbar');
            const emptyState = document.getElementById('emptyState');
            const canvasContainer = document.getElementById('canvasContainer');
            const webMapFrame = document.getElementById('webMapFrame');
            const tabChartsView = document.getElementById('tabChartsView');
            const tabMapView = document.getElementById('tabMapView');

            const plateTitle = document.getElementById('plateTitle');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const pageNumberInput = document.getElementById('pageNumberInput');
            const totalPagesText = document.getElementById('totalPagesText');
            const zoomInBtn = document.getElementById('zoomIn');
            const zoomOutBtn = document.getElementById('zoomOut');
            const zoomLevel = document.getElementById('zoomLevel');
            const deleteBtn = document.getElementById('deletePlate');
            const nightToggle = document.getElementById('nightToggle');

            const storageText = document.getElementById('storageText');
            const storageBarFill = document.getElementById('storageBarFill');

            const simClockDisplay = document.getElementById('simClockDisplay');
            const setSimTimeBtn = document.getElementById('setSimTimeBtn');
            const exportDataPackBtn = document.getElementById('exportDataPackBtn');
            const importDataPackBtn = document.getElementById('importDataPackBtn');
            const dataPackFileInput = document.getElementById('dataPackFileInput');

            // --- Sim Time Clock Engine ---
            function updateSimClock() {
                const now = new Date(Date.now() + simTimeOffsetMs);
                const h = String(now.getUTCHours()).padStart(2, '0');
                const m = String(now.getUTCMinutes()).padStart(2, '0');
                const s = String(now.getUTCSeconds()).padStart(2, '0');
                simClockDisplay.textContent = `${h}:${m}:${s}`;
            }

            setInterval(updateSimClock, 1000);
            updateSimClock();

            setSimTimeBtn.onclick = () => {
                const timeInput = prompt('Set Simulator Starting Time (HH:MM or HH:MM:SS in UTC):', '14:30');
                if (timeInput) {
                    const parts = timeInput.split(':').map(n => parseInt(n, 10));
                    if (!isNaN(parts[0]) && !isNaN(parts[1])) {
                        const targetDate = new Date();
                        targetDate.setUTCHours(parts[0], parts[1], parts[2] || 0, 0);
                        simTimeOffsetMs = targetDate.getTime() - Date.now();
                        updateSimClock();
                    }
                }
            };

            // Base64 Binary Helper
            function arrayBufferToBase64(buffer) {
                let binary = '';
                const bytes = new Uint8Array(buffer);
                const len = bytes.byteLength;
                const chunkSize = 0x8000;
                for (let i = 0; i < len; i += chunkSize) {
                    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
                }
                return window.btoa(binary);
            }

            // Export Data Pack Engine (Saves Page Position State)
            exportDataPackBtn.onclick = async () => {
                if (userFolders.length === 0 && database.length === 0) {
                    alert('No folders or files available to export in Data Pack.');
                    return;
                }

                exportDataPackBtn.textContent = '⏳ Exporting...';
                
                setTimeout(async () => {
                    try {
                        const freshPlates = await dbGetAll('plates');

                        const serializablePlates = freshPlates.map(p => {
                            if (!p.fileBuffer || p.fileBuffer.byteLength === 0) {
                                throw new Error(`Chart "${p.name}" contains detached or corrupted buffer data.`);
                            }
                            
                            const safeBuffer = p.fileBuffer.slice(0);

                            return {
                                id: p.id,
                                folderId: p.folderId,
                                name: p.name,
                                lastPage: p.lastPage || 1,
                                base64Data: arrayBufferToBase64(safeBuffer)
                            };
                        });

                        const packPayload = {
                            version: '2.2',
                            exportDate: new Date().toISOString(),
                            folders: userFolders,
                            plates: serializablePlates
                        };

                        const jsonStr = JSON.stringify(packPayload);
                        const fileName = `CondorEFB_DataPack_${new Date().toISOString().slice(0, 10)}.condorefb`;
                        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });

                        if ('showSaveFilePicker' in window) {
                            try {
                                const handle = await window.showSaveFilePicker({
                                    suggestedName: fileName,
                                    types: [{
                                        description: 'CondorEFB Data Pack',
                                        accept: { 'application/json': ['.condorefb'] },
                                    }],
                                });
                                const writable = await handle.createWritable();
                                await writable.write(blob);
                                await writable.close();
                                exportDataPackBtn.textContent = '📥 Export Pack';
                                return;
                            } catch (err) {
                                if (err.name === 'AbortError') {
                                    exportDataPackBtn.textContent = '📥 Export Pack';
                                    return;
                                }
                            }
                        }

                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        a.rel = 'noopener';
                        document.body.appendChild(a);
                        a.click();

                        setTimeout(() => {
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }, 5000);

                    } catch (e) {
                        alert('Error generating Data Pack export: ' + e.message);
                    } finally {
                        exportDataPackBtn.textContent = '📥 Export Pack';
                    }
                }, 50);
            };

            importDataPackBtn.onclick = () => dataPackFileInput.click();

            dataPackFileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const text = await file.text();
                try {
                    const pack = JSON.parse(text);
                    if (!pack.folders || !pack.plates) throw new Error('Invalid Data Pack format.');

                    if (confirm('Importing this Data Pack will merge folders and charts into your current EFB. Continue?')) {
                        for (let f of pack.folders) {
                            if (!userFolders.some(uf => uf.id === f.id)) {
                                userFolders.push(f);
                                await dbPut('folders', f);
                            }
                        }

                        for (let p of pack.plates) {
                            if (!database.some(dp => dp.id === p.id)) {
                                const binary = atob(p.base64Data);
                                const bytes = new Uint8Array(binary.length);
                                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                                
                                const plateRecord = {
                                    id: p.id,
                                    folderId: p.folderId,
                                    name: p.name,
                                    lastPage: p.lastPage || 1,
                                    fileBuffer: bytes.buffer
                                };

                                database.push(plateRecord);
                                await dbPut('plates', plateRecord);
                            }
                        }

                        renderLeftSidebar(folderSearchInput.value);
                        renderPlatesColumn();
                        updateStorageMeter();
                        alert('Data Pack successfully imported!');
                    }
                } catch (err) {
                    alert('Failed to parse Data Pack file. Ensure it is a valid .condorefb or .json backup.');
                }
                dataPackFileInput.value = '';
            });

            // View Switcher Tabs Logic
            tabChartsView.onclick = () => {
                tabChartsView.classList.add('active');
                tabMapView.classList.remove('active');
                webMapFrame.style.display = 'none';
                canvasContainer.style.display = 'flex';
                if (activePlateRecord) toolbar.style.display = 'flex';
                sidebarContainer.style.display = 'flex';
            };

            tabMapView.onclick = () => {
                tabMapView.classList.add('active');
                tabChartsView.classList.remove('active');
                canvasContainer.style.display = 'none';
                toolbar.style.display = 'none';
                webMapFrame.style.display = 'block';
            };

            // Toggle Sidebar Navigation
            toggleSidebarBtn.onclick = () => {
                sidebarContainer.classList.toggle('collapsed');
                toggleSidebarBtn.textContent = sidebarContainer.classList.contains('collapsed') ? '► Show' : '◄ Hide';
            };

            // Storage Usage Meter Tracker
            async function updateStorageMeter() {
                if ('storage' in navigator && 'estimate' in navigator.storage) {
                    const { usage, quota } = await navigator.storage.estimate();
                    const usageMB = (usage / (1024 * 1024)).toFixed(1);
                    const quotaMB = (quota / (1024 * 1024)).toFixed(0);
                    const percentage = Math.min(100, (usage / quota) * 100);

                    storageText.textContent = `${usageMB} MB / ${quotaMB} MB`;
                    storageBarFill.style.width = `${Math.max(percentage, 2)}%`;

                    if (percentage > 85) storageBarFill.style.backgroundColor = 'var(--accent-danger)';
                    else if (percentage > 65) storageBarFill.style.backgroundColor = 'var(--accent-warn)';
                    else storageBarFill.style.backgroundColor = 'var(--accent-blue)';
                }
            }

            // Initialize App
            async function initApp() {
                await initDB();
                userFolders = await dbGetAll('folders');
                database = await dbGetAll('plates');
                renderLeftSidebar();
                updateStorageMeter();
            }

            initApp();

            // Create Folder
            createUserFolderBtn.onclick = async () => {
                const folderName = prompt('Enter Folder Name (e.g. Checklists, RKJK - Kunsan):', '');
                if (!folderName || folderName.trim() === '') return;

                const categoryChoice = prompt('Type 1 for "Documents" or 2 for "AIP (Airport Charts)":', '2');
                const category = categoryChoice === '1' ? 'documents' : 'aip';

                const newFolder = { 
                    id: 'uf_' + Date.now(), 
                    name: folderName.trim(),
                    category: category
                };
                
                userFolders.push(newFolder);
                await dbPut('folders', newFolder);
                renderLeftSidebar(folderSearchInput.value);
                selectFolder(newFolder);
            };

            // Render Left Sidebar split by Categories
            function renderLeftSidebar(filterText = '') {
                foldersScrollList.innerHTML = '';
                const term = filterText.toLowerCase();
                const filteredFolders = userFolders.filter(f => f.name.toLowerCase().includes(term));

                if (filteredFolders.length === 0) {
                    const emptyNotice = document.createElement('div');
                    emptyNotice.style.cssText = 'padding: 16px; font-size: 11px; color: var(--text-dim); text-align: center;';
                    emptyNotice.innerHTML = filterText 
                        ? 'No matching folders found.' 
                        : 'No folders yet.<br><br>Click <strong>"+ Folder"</strong> to create a Document or AIP Chart folder.';
                    foldersScrollList.appendChild(emptyNotice);
                    return;
                }

                const docFolders = filteredFolders.filter(f => f.category === 'documents');
                const aipFolders = filteredFolders.filter(f => f.category !== 'documents');

                if (docFolders.length > 0) {
                    const catHeader = document.createElement('div');
                    catHeader.className = 'category-section-header';
                    catHeader.textContent = '📚 Documents';
                    foldersScrollList.appendChild(catHeader);
                    docFolders.forEach(folder => renderFolderItem(folder));
                }

                if (aipFolders.length > 0) {
                    const catHeader = document.createElement('div');
                    catHeader.className = 'category-section-header';
                    catHeader.textContent = '✈️ AIP Charts';
                    foldersScrollList.appendChild(catHeader);
                    aipFolders.forEach(folder => renderFolderItem(folder));
                }
            }

            function renderFolderItem(folder) {
                const count = database.filter(p => p.folderId === folder.id).length;
                const card = document.createElement('div');
                card.className = `folder-card ${selectedFolder && selectedFolder.id === folder.id ? 'active' : ''}`;
                
                card.innerHTML = `
                    <div class="folder-header-line">
                        <span>📁 ${folder.name}</span>
                        <div class="folder-actions">
                            <span class="badge ${count > 0 ? 'active' : ''}">${count}</span>
                            <button class="icon-btn edit-btn" title="Rename">✏️</button>
                            <button class="icon-btn del-btn" title="Delete" style="color:#ff5555;">✕</button>
                        </div>
                    </div>
                `;

                card.querySelector('.edit-btn').onclick = async (e) => {
                    e.stopPropagation();
                    const newName = prompt('Rename folder:', folder.name);
                    if (newName && newName.trim() !== '') {
                        folder.name = newName.trim();
                        await dbPut('folders', folder);
                        renderLeftSidebar(folderSearchInput.value);
                        if (selectedFolder && selectedFolder.id === folder.id) selectFolder(folder);
                    }
                };

                card.querySelector('.del-btn').onclick = async (e) => {
                    e.stopPropagation();
                    if (confirm(`Delete folder "${folder.name}" and all stored PDFs?`)) {
                        userFolders = userFolders.filter(f => f.id !== folder.id);
                        await dbDelete('folders', folder.id);

                        const platesToDelete = database.filter(p => p.folderId === folder.id);
                        for (let p of platesToDelete) {
                            await dbDelete('plates', p.id);
                        }
                        database = database.filter(p => p.folderId !== folder.id);

                        if (selectedFolder && selectedFolder.id === folder.id) {
                            selectedFolder = null;
                            activePlateRecord = null;
                            currentPdf = null;
                            canvas.style.display = 'none';
                            toolbar.style.display = 'none';
                            emptyState.style.display = 'block';
                        }
                        renderLeftSidebar(folderSearchInput.value);
                        renderPlatesColumn();
                        updateStorageMeter();
                    }
                };

                card.onclick = () => selectFolder(folder);
                foldersScrollList.appendChild(card);
            }

            function selectFolder(folder) {
                selectedFolder = folder;
                uploadPdfBtn.style.display = 'inline-block';
                renderLeftSidebar(folderSearchInput.value);
                renderPlatesColumn();
            }

            function renderPlatesColumn() {
                if (!selectedFolder) {
                    platesHeaderTitle.textContent = 'Select Folder';
                    uploadPdfBtn.style.display = 'none';
                    platesList.innerHTML = `<div style="padding: 16px; font-size: 12px; color: var(--text-dim); text-align: center;">Select a folder on the left.</div>`;
                    return;
                }

                platesHeaderTitle.textContent = selectedFolder.name;
                platesList.innerHTML = '';

                const folderPlates = database.filter(p => p.folderId === selectedFolder.id);

                if (folderPlates.length === 0) {
                    platesList.innerHTML = `
                        <div style="padding: 16px; font-size: 12px; color: var(--text-dim); text-align: center;">
                            No PDFs in <strong>${selectedFolder.name}</strong>.<br><br>
                            Click <strong>"+ PDF"</strong> above to add files.
                        </div>
                    `;
                    return;
                }

                folderPlates.forEach(plate => {
                    const card = document.createElement('div');
                    const isActive = activePlateRecord && activePlateRecord.id === plate.id;
                    card.className = `plate-card ${isActive ? 'active' : ''}`;
                    const lastPg = plate.lastPage || 1;
                    card.innerHTML = `
                        <div class="plate-title-text">${plate.name}</div>
                        <div class="plate-meta-text">${lastPg > 1 ? `Resume Page ${lastPg}` : 'Page 1'}</div>
                    `;
                    card.onclick = () => loadPlate(plate);
                    platesList.appendChild(card);
                });
            }

            uploadPdfBtn.onclick = () => selectedFolder && fileInput.click();

            fileInput.addEventListener('change', async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                for (let file of files) {
                    if (file.type === 'application/pdf') {
                        const arrayBuffer = await file.arrayBuffer();
                        const plateRecord = {
                            id: Date.now() + Math.random().toString(36).substr(2, 9),
                            folderId: selectedFolder.id,
                            name: file.name.replace(/\.pdf$/i, ''),
                            lastPage: 1,
                            fileBuffer: arrayBuffer
                        };

                        database.push(plateRecord);
                        await dbPut('plates', plateRecord);
                    }
                }
                renderLeftSidebar(folderSearchInput.value);
                renderPlatesColumn();
                updateStorageMeter();
                fileInput.value = '';
            });

            folderSearchInput.addEventListener('input', (e) => renderLeftSidebar(e.target.value));

            // Load PDF with Page-State Restoration
            async function loadPlate(plate) {
                activePlateRecord = plate;
                renderPlatesColumn();

                plateTitle.textContent = `${selectedFolder.name} — ${plate.name}`;
                toolbar.style.display = 'flex';
                emptyState.style.display = 'none';
                canvas.style.display = 'block';

                if (currentRenderTask) {
                    currentRenderTask.cancel();
                    currentRenderTask = null;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const loadingTask = pdfjsLib.getDocument({ data: plate.fileBuffer });
                currentPdf = await loadingTask.promise;
                totalPages = currentPdf.numPages;
                
                // Restore last saved page or default to 1
                let savedPage = plate.lastPage || 1;
                if (savedPage > totalPages) savedPage = totalPages;
                currentPageNum = savedPage;

                totalPagesText.textContent = `/ ${totalPages}`;
                pageNumberInput.max = totalPages;
                pageNumberInput.value = currentPageNum;

                renderPage(currentPageNum);
            }

            // Save Page Position to State & IndexedDB
            async function persistCurrentPage() {
                if (!activePlateRecord) return;
                activePlateRecord.lastPage = currentPageNum;
                await dbPut('plates', activePlateRecord);
                renderPlatesColumn();
            }

            // High-DPI Crisp PDF Rendering Engine
            async function renderPage(pageNum) {
                if (!currentPdf) return;

                if (currentRenderTask) {
                    currentRenderTask.cancel();
                    currentRenderTask = null;
                }

                const page = await currentPdf.getPage(pageNum);
                
                // Device Pixel Ratio for iPad Retina Displays
                const dpr = window.devicePixelRatio || 1;
                
                // Calculate Scaled Viewport
                const viewport = page.getViewport({ scale: currentScale * dpr });
                
                // Internal Canvas Dimensions match High-DPI Resolution
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                // Scale Down CSS Dimensions so Vectors remain Razor Sharp on Display
                canvas.style.width = `${viewport.width / dpr}px`;
                canvas.style.height = `${viewport.height / dpr}px`;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                try {
                    currentRenderTask = page.render(renderContext);
                    await currentRenderTask.promise;
                    currentRenderTask = null;
                } catch (err) {
                    if (err.name !== 'RenderingCancelledException') console.error(err);
                }

                zoomLevel.textContent = `${Math.round(currentScale * 100)}%`;
            }

            // Page Navigation Controls
            prevPageBtn.onclick = async () => {
                if (currentPageNum > 1) {
                    currentPageNum--;
                    pageNumberInput.value = currentPageNum;
                    await renderPage(currentPageNum);
                    persistCurrentPage();
                }
            };

            nextPageBtn.onclick = async () => {
                if (currentPageNum < totalPages) {
                    currentPageNum++;
                    pageNumberInput.value = currentPageNum;
                    await renderPage(currentPageNum);
                    persistCurrentPage();
                }
            };

            pageNumberInput.addEventListener('change', async (e) => {
                let targetPage = parseInt(e.target.value, 10);
                if (isNaN(targetPage) || targetPage < 1) targetPage = 1;
                if (targetPage > totalPages) targetPage = totalPages;
                
                currentPageNum = targetPage;
                e.target.value = currentPageNum;
                await renderPage(currentPageNum);
                persistCurrentPage();
            });

            // Re-render Vector Data on Zoom
            zoomInBtn.onclick = () => { 
                currentScale += 0.25; 
                renderPage(currentPageNum); 
            };

            zoomOutBtn.onclick = () => { 
                if (currentScale > 0.5) { 
                    currentScale -= 0.25; 
                    renderPage(currentPageNum); 
                } 
            };

            // Delete Active Chart
            deleteBtn.onclick = async () => {
                if (!activePlateRecord) return;
                await dbDelete('plates', activePlateRecord.id);
                database = database.filter(p => p.id !== activePlateRecord.id);
                
                activePlateRecord = null;
                currentPdf = null;
                canvas.style.display = 'none';
                toolbar.style.display = 'none';
                emptyState.style.display = 'block';
                
                renderLeftSidebar(folderSearchInput.value);
                renderPlatesColumn();
                updateStorageMeter();
            };

            // Night Mode Toggle
            nightToggle.onclick = () => document.body.classList.toggle('night-mode');
        });
    </script>
</body>
</html>
